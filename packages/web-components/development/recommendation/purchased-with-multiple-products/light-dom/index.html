<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
    <title>Purchased With Multiple Products - Light DOM</title>
    <style>
        relewise-purchased-with-multiple-products:not(:defined)>[slot='before-results'] {
            display: none;
        }

        relewise-purchased-with-multiple-products {
            max-width: 100%;
        }

        relewise-purchased-with-multiple-products .rw-product-recommendation-grid {
            max-width: 100%;
        }

        [slot='before-results'] {
            padding: 1rem;
            max-width: 100%;
            background: #f3edff;
        }
    </style>
</head>

<body>
    <script type="module" src="index.ts"></script>
    <h1>Purchased With Multiple Products - Light DOM</h1>

    <h2>With before-results content</h2>
    <relewise-purchased-with-multiple-products displayed-at-location="light dom development" number-of-recommendations="10">
        <div slot="before-results">Content before the product grid</div>
        <product-and-variant-id product-id="1922"></product-and-variant-id>
        <product-and-variant-id product-id="1823" variant-id="1615"></product-and-variant-id>
    </relewise-purchased-with-multiple-products>

    <h2>Without before-results content</h2>
    <relewise-purchased-with-multiple-products displayed-at-location="light dom development">
        <product-and-variant-id product-id="1922"></product-and-variant-id>
        <product-and-variant-id product-id="1823" variant-id="1615"></product-and-variant-id>
    </relewise-purchased-with-multiple-products>
</body>

</html>
