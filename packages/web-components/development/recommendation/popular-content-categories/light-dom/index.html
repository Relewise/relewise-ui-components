<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
    <title>Popular Content Categories - Light DOM</title>
    <style>
        relewise-popular-content-categories:not(:defined)>[slot='before-results'] {
            display: none;
        }

        relewise-popular-content-categories {
            max-width: 100%;
        }

        relewise-popular-content-categories .rw-category-recommendation-grid {
            max-width: 100%;
        }

        [slot='before-results'] {
            padding: 1rem;
            max-width: 100%;
            background: #f3edff;
        }
    </style>
</head>

<body>
    <script type="module" src="index.ts"></script>
    <h1>Popular Content Categories - Light DOM</h1>

    <h2>With before-results content</h2>
    <relewise-popular-content-categories displayed-at-location="light dom development" number-of-recommendations="10">
        <div slot="before-results">Content before the category grid</div>
    </relewise-popular-content-categories>

    <h2>Without before-results content</h2>
    <relewise-popular-content-categories displayed-at-location="light dom development"></relewise-popular-content-categories>
</body>

</html>
