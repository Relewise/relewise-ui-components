<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
    <title>Recently Viewed Products - Light DOM</title>
    <style>
        relewise-recently-viewed-products:not(:defined)>[slot='before-results'] {
            display: none;
        }

        relewise-recently-viewed-products {
            max-width: 100%;
        }

        relewise-recently-viewed-products .rw-product-recommendation-grid {
            max-width: 100%;
        }

        [slot='before-results'] {
            padding: 1rem;
            max-width: 100%;
            background: #f3edff;
        }
    </style>
</head>

<body>
    <script type="module" src="index.ts"></script>
    <h1>Recently Viewed Products - Light DOM</h1>

    <h2>With before-results content</h2>
    <relewise-recently-viewed-products displayed-at-location="light dom development" number-of-recommendations="10">
        <div slot="before-results">Content before the product grid</div>
    </relewise-recently-viewed-products>

    <h2>Without before-results content</h2>
    <relewise-recently-viewed-products displayed-at-location="light dom development"></relewise-recently-viewed-products>
</body>

</html>
