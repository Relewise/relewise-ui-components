<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
    <title>Popular Search Terms - Light DOM</title>
    <style>
        relewise-popular-search-terms:not(:defined)>[slot='before-results'] {
            display: none;
        }

        [slot='before-results'] {
            padding: 1rem;
            background: #f3edff;
        }
    </style>
</head>

<body>
    <script type="module" src="index.ts"></script>
    <h1>Popular Search Terms - Light DOM</h1>

    <h2>With before-results content</h2>
    <relewise-popular-search-terms displayed-at-location="light dom development" number-of-recommendations="10">
        <div slot="before-results">Content before the search terms</div>
    </relewise-popular-search-terms>

    <h2>Without before-results content</h2>
    <relewise-popular-search-terms displayed-at-location="light dom development"></relewise-popular-search-terms>
</body>

</html>
